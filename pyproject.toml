[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakitdown"
version = "0.2.0rc1"
description = "Local-first agent harness for long-horizon tasks on small edge language models"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
bid = "bid.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["bid", "prompts"]

[tool.setuptools.package-data]
prompts = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
